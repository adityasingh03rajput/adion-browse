<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab - Adion Browse</title>
  <link rel="stylesheet" href="newtab.css">
</head>

<body>
  <div class="newtab-background"></div>

  <div class="newtab-container">
    <!-- Top Privacy Statistics (Brave Style) -->
    <header class="stats-header">
      <div class="stat-card">
        <div class="stat-icon-wrapper">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff5500" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
        <div class="stat-content">
          <div class="stat-value" id="statBlocked">0</div>
          <div class="stat-label">Trackers & ads blocked</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon-wrapper">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div class="stat-content">
          <div class="stat-value" id="statBandwidth">0 KB</div>
          <div class="stat-label">Bandwidth saved</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon-wrapper">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </div>
        <div class="stat-content">
          <div class="stat-value" id="statTime">0 s</div>
          <div class="stat-label">Time saved</div>
        </div>
      </div>
    </header>

    <!-- Center Hero: Clock & Search -->
    <main class="hero-section">
      <div class="clock-display" id="clockDisplay">12:00</div>
      <div class="date-display" id="dateDisplay">Tuesday, November 10</div>

      <!-- Search Bar -->
      <form class="search-box" id="searchForm">
        <div class="search-engine-badge" id="searchEngineBadge" title="Search Engine: Brave Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff5500" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span id="currentEngineLabel">Brave</span>
        </div>
        <input type="text" id="searchInput" placeholder="Search the web privately or enter URL..." autofocus
          autocomplete="off">
        <button type="submit" class="search-submit-btn" title="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <!-- Speed Dial Shortcuts Grid -->
      <div class="shortcuts-grid" id="shortcutsGrid">
        <!-- Rendered dynamically -->
      </div>
    </main>

    <!-- Footer -->
    <footer class="newtab-footer">
      <div class="privacy-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ff5500" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span>Adion Shields Protection Active</span>
      </div>
    </footer>
  </div>

  <script src="newtab.js"></script>
</body>

</html>
